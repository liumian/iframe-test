<html>
<body>
  <div id="log" style="background:#f0f0f0;padding:10px;margin-bottom:10px;min-height:50px">
    等待平台消息...
  </div>
  <input id="val" placeholder="输入任意内容" />
  <button id="btn" disabled>Submit</button>
  <div id="sent" style="margin-top:10px;color:green"></div>

  <script>
    var receivedToken = null;

    window.addEventListener('message', function(e) {
      document.getElementById('log').innerText = JSON.stringify(e.data);
      if (e.data && e.data.token) {
        receivedToken = e.data.token;
        document.getElementById('btn').disabled = false;
      }
    });

    document.getElementById('btn').onclick = function() {
      var val = document.getElementById('val').value;
      var msg = { token: receivedToken, value: val };
      window.parent.postMessage(msg, '*');
      document.getElementById('sent').innerText = '已发送：' + JSON.stringify(msg);
    };
  </script>
</body>
</html>
